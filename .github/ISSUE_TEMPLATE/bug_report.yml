name: Bug report
description: Report incorrect, unexpected, or inconsistent behavior in business-time
title: "[Bug]: "
labels:
  - Bug Report
  - Needs Reproduction
assignees:
  - himakhaitan
type: bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in `business-time`.

        `business-time` deals with calendar and time semantics where behavior can
        depend on timezone, DST transitions, calendar boundaries, fiscal settings,
        and the distinction between calendar arithmetic and elapsed durations.

        Please provide enough information for the issue to be reproduced locally.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the incorrect or unexpected behavior.
      placeholder: |
        StartOfDay returned a boundary in the wrong timezone when the Calendar
        was configured with America/New_York.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the expected behavior and, where possible, the exact expected value.
      placeholder: |
        I expected StartOfDay to return 2026-03-10 00:00:00 in
        America/New_York.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What did you get?
      description: Provide the exact value or behavior returned by business-time.
      placeholder: |
        StartOfDay returned 2026-03-09 23:00:00 -0400 EDT.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest Go program or test case that reproduces the issue.
      render: go
      placeholder: |
        package main

        import (
            "fmt"
            "time"

            "github.com/himanshukhaitan/business-time/calendar"
        )

        func main() {
            location, _ := time.LoadLocation("America/New_York")

            cal, err := calendar.New(calendar.Config{
                Location: location,
            })
            if err != nil {
                panic(err)
            }

            value := time.Date(
                2026, 3, 10,
                12, 0, 0, 0,
                location,
            )

            fmt.Println(cal.StartOfDay(value))
        }
    validations:
      required: true

  - type: input
    id: business-time-version
    attributes:
      label: business-time version
      description: Which version of business-time are you using?
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Run go version to find this.
      placeholder: go1.25.0
    validations:
      required: true

  - type: input
    id: timezone
    attributes:
      label: Timezone
      description: Which IANA timezone is relevant to the issue?
      placeholder: America/New_York
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Provide the configuration if relevant.
      render: go
      placeholder: |
        calendar.Config{
            Location:        location,
            WeekStart:       time.Monday,
            FiscalYearStart: time.January,
        }
    validations:
      required: false

  - type: textarea
    id: input-values
    attributes:
      label: Input values
      description: Provide the exact input time values, including timezone or offset.
      placeholder: |
        Input:
        2026-03-10 12:00:00 America/New_York

        Comparison value:
        2026-03-10 17:00:00 UTC
    validations:
      required: false

  - type: checkboxes
    id: conditions
    attributes:
      label: Relevant conditions
      description: Select all conditions that apply.
      options:
        - label: Occurs around a daylight-saving transition.
        - label: Occurs around midnight or a calendar boundary.
        - label: Involves different timezones or timezone conversion.
        - label: Involves a leap year or February.
        - label: Involves a fiscal-year boundary.
        - label: Involves a fiscal-quarter boundary.
        - label: Involves week-start configuration.
        - label: Involves calendar arithmetic.
        - label: Involves elapsed-duration arithmetic.
        - label: Behavior differs depending on the system's local timezone.

  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If this worked in an earlier version, provide the last known working version.
      placeholder: |
        Worked in: v1.0.0
        First affected version: v1.0.1
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, examples, links, related issues, or other useful information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have provided a minimal reproduction.
          required: true